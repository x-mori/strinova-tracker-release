      <path class="ne-string ne-sway" d="M21 36Q26 36.5 29.6 40.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path class="ne-string ne-sway ne-late" d="M43 36Q38 36.5 34.4 40.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <text x="80" y="158" class="name" fill="#e5919a">Eclipse</text>
    <text x="80" y="180" class="range">Below 0 MU / round</text></g>
