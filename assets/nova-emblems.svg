<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="960" height="210">
<style><![CDATA[
/* NOVA emblems: strings flow, the core breathes, higher bands add rays and orbits.
   Only transform / opacity / dash offset animate, so a full match list stays cheap. */
.nova-emblem .ne-glow, .nova-emblem .ne-star, .nova-emblem .ne-twinkle, .nova-emblem .ne-flare,
.nova-emblem .ne-sway { transform-box: fill-box; transform-origin: center; }
.nova-emblem .ne-spin, .nova-emblem .ne-ripple { transform-box: view-box; transform-origin: 32px 32px; }
.nova-emblem .ne-string { stroke-dasharray: 6 4; animation: ne-flow 2.4s linear infinite; opacity: .9; }
.nova-emblem .ne-string.ne-fast { animation-duration: 1.4s; }
.nova-emblem .ne-string.ne-rev { animation-direction: reverse; }
.nova-emblem .ne-glow { animation: ne-glow 2.8s ease-in-out infinite; }
.nova-emblem .ne-star { animation: ne-star 2.8s ease-in-out infinite; }
.nova-emblem .ne-twinkle { animation: ne-twinkle 2.2s ease-in-out infinite; }
.nova-emblem .ne-late { animation-delay: -1.1s; }
.nova-emblem .ne-ripple { animation: ne-ripple 2.6s ease-out infinite; }
.nova-emblem .ne-ripple.ne-late { animation-delay: -1.3s; }
.nova-emblem .ne-seq { animation: ne-seq 1.5s ease-in-out infinite; }
.nova-emblem .ne-d2 { animation-delay: .25s; }
.nova-emblem .ne-d3 { animation-delay: .5s; }
.nova-emblem .ne-rays { stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; opacity: .7; }
.nova-emblem .ne-spin { animation: ne-spin 18s linear infinite; }
.nova-emblem .ne-spin.ne-rev { animation-direction: reverse; animation-duration: 26s; }
.nova-emblem .ne-corona { animation-duration: 12s; opacity: .85; }
.nova-emblem .ne-flare { animation: ne-flare 2.8s ease-in-out infinite; }
.nova-emblem .ne-sway { stroke-dasharray: none; animation: ne-sway 3s ease-in-out infinite alternate; }
.nova-emblem .ne-eclipse-orbit { transform-box: view-box; transform-origin: 32px 26px; animation: ne-spin 9s linear infinite; }
@keyframes ne-flow { to { stroke-dashoffset: -20; } }
@keyframes ne-glow { 0%, 100% { opacity: .55; transform: scale(.88); } 50% { opacity: 1; transform: scale(1.08); } }
@keyframes ne-star { 0%, 100% { transform: scale(.94) rotate(0deg); } 50% { transform: scale(1.06) rotate(8deg); } }
@keyframes ne-twinkle { 0%, 100% { opacity: 0; transform: scale(.4) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } }
@keyframes ne-ripple { from { opacity: .8; transform: scale(.55); } to { opacity: 0; transform: scale(1.45); } }
@keyframes ne-seq { 0%, 100% { opacity: .25; } 40% { opacity: 1; } }
@keyframes ne-spin { to { transform: rotate(360deg); } }
@keyframes ne-flare { 0%, 100% { opacity: .35; transform: scaleX(.6); } 50% { opacity: .85; transform: scaleX(1.12); } }
@keyframes ne-sway { from { transform: translateY(-1.5px) rotate(-3deg); } to { transform: translateY(1.5px) rotate(3deg); } }

.name { font: 700 17px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: .06em; text-anchor: middle; text-transform: uppercase; }
.range { font: 500 12px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8d9cb2; text-anchor: middle; }
]]></style>
<rect width="960" height="210" rx="18" fill="#0b111b"/>
<rect x=".5" y=".5" width="959" height="209" rx="17.5" fill="none" stroke="#24344b"/>
<g style="color:#e5919a"><svg x="32" y="30" width="96" height="96" class="nova-emblem ne-eclipse" viewBox="0 0 64 64" aria-hidden="true"><defs><radialGradient id="ne1c"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".35" stop-color="currentColor" stop-opacity=".55"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></radialGradient>
    <linearGradient id="ne1p" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".3"/><stop offset=".55" stop-color="currentColor" stop-opacity=".08"/><stop offset="1" stop-color="currentColor" stop-opacity=".18"/></linearGradient></defs><path d="M14 10h36l4 6L32 58 10 16Z" fill="url(#ne1p)" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M19 15h26L32 47Z" fill="none" stroke="currentColor" stroke-width=".8" opacity=".35"/>
      <circle class="ne-glow" cx="32" cy="26" r="13" fill="url(#ne1c)"/>
      <circle cx="32" cy="26" r="8.6" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/>
